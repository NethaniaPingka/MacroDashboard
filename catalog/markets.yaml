# Market data via yfinance. No API key needed, so these are the series that can
# be tested first and the ones most likely to break later — yfinance scrapes an
# undocumented endpoint. Every ticker here is verified working; re-run
# `python scripts/audit_catalog.py --source yahoo` if charts go flat.

- series_id: MKT.USDIDR
  name: USD/IDR
  country: ID
  category: markets
  subcategory: fx
  source: yahoo
  source_id: IDR=X
  frequency: D
  unit: IDR per USD
  default_transform: level

- series_id: MKT.JKSE
  name: Jakarta Composite Index
  country: ID
  category: markets
  subcategory: equity
  source: yahoo
  source_id: ^JKSE
  frequency: D
  unit: Index
  default_transform: level

- series_id: MKT.DXY
  name: US dollar index (DXY)
  country: US
  category: markets
  subcategory: fx
  source: yahoo
  source_id: DX-Y.NYB
  frequency: D
  unit: Index
  default_transform: level

- series_id: MKT.EURUSD
  name: EUR/USD
  country: EA
  category: markets
  subcategory: fx
  source: yahoo
  source_id: EURUSD=X
  frequency: D
  unit: USD per EUR
  default_transform: level

