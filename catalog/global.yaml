# Global macro series, all from FRED.
#
# Every id here was audited against the live API on 2026-08-18. Re-run
# `python scripts/audit_catalog.py` after editing, and periodically — FRED
# retires and renames international series, and the euro-area ids embed the
# membership count (EZ19 -> EZ20), which will change as the bloc grows.

