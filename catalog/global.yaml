# ------------------------------------------- US GDP growth contributions (BEA)
# Percentage points of the quarter's annualised real GDP growth, published by
# BEA rather than derived here. Deliberately not computed from the real level
# series (PCEC96, GPDIC1, ...): those are chain-weighted, so their changes do
# not add up to the headline. PCE + investment + government + net exports sums
# to US.GDP.REAL's qoq_saar to within a rounding tenth; a hand-rolled version
# from chained dollars does not.
#
# Exports and imports are the split of net exports and must not be added
# alongside it — charting all six would double-count trade.
- series_id: US.GDP.CONTRIB.PCE
  name: Consumption contribution to GDP growth
  country: US
  category: growth
  subcategory: gdp_contribution
  source: fred
  source_id: DPCERY2Q224SBEA
  frequency: Q
  unit: Percentage points, SAAR
  seasonal_adj: true
  default_transform: level

- series_id: US.GDP.CONTRIB.INVESTMENT
  name: Investment contribution to GDP growth
  country: US
  category: growth
  subcategory: gdp_contribution
  source: fred
  source_id: A006RY2Q224SBEA
  frequency: Q
  unit: Percentage points, SAAR
  seasonal_adj: true
  default_transform: level
  notes: Gross private domestic investment, so it carries the inventory swing.

- series_id: US.GDP.CONTRIB.GOVERNMENT
  name: Government contribution to GDP growth
  country: US
  category: growth
  subcategory: gdp_contribution
  source: fred
  source_id: A822RY2Q224SBEA
  frequency: Q
  unit: Percentage points, SAAR
  seasonal_adj: true
  default_transform: level

- series_id: US.GDP.CONTRIB.NETEXPORTS
  name: Net exports contribution to GDP growth
  country: US
  category: growth
  subcategory: gdp_contribution
  source: fred
  source_id: A019RY2Q224SBEA
  frequency: Q
  unit: Percentage points, SAAR
  seasonal_adj: true
  default_transform: level

- series_id: US.GDP.CONTRIB.EXPORTS
  name: Exports contribution to GDP growth
  country: US
  category: growth
  subcategory: gdp_contribution
  source: fred
  source_id: A020RY2Q224SBEA
  frequency: Q
  unit: Percentage points, SAAR
  seasonal_adj: true
  default_transform: level
  notes: Half of US.GDP.CONTRIB.NETEXPORTS. Never chart both.

- series_id: US.GDP.CONTRIB.IMPORTS
  name: Imports contribution to GDP growth
  country: US
  category: growth
  subcategory: gdp_contribution
  source: fred
  source_id: A021RY2Q224SBEA
  frequency: Q
  unit: Percentage points, SAAR
  seasonal_adj: true
  default_transform: level
  notes: >
    Already signed as a contribution, so it is negative when imports rise.
    Do not flip the sign again.

# ============================== Asia ex-Indonesia — OUT OF SCOPE FOR v1 =======
#
# Decision, 2026-08-18: the global view is US + euro area only. Everything in
# this section is inactive and none of it reaches the app.
#
# The reason is sourcing, not interest. FRED cannot support a regional Asian
# view at monthly frequency:
#
#   * Singapore, Malaysia, Thailand, Philippines — no monthly CPI and no policy
#     rate exist on FRED at all. Only annual World Bank inflation
#     (FPCPITOTLZG{ISO3}, verified working) and BIS effective exchange rates.
#     Annual inflation is too coarse to be worth a tab.
#   * China, Japan, India — monthly CPI mirrors exist but are abandoned
#     upstream, last observations 2025-04, 2021-06, and 2025-03 respectively.
#
# Reviving this section means adding a second data spine, most plausibly IMF
# IFS (monthly CPI and policy rates for nearly every country, free, no key).
# The entries below are kept rather than deleted so that work starts from a
# record of what was already tried, instead of rediscovering these dead ends.
#
# --- abandoned upstream: id resolves, data stopped ---
- series_id: CN.CPI.IDX
  name: China CPI, all items
  country: CN
  category: inflation
  source: fred
  source_id: CHNCPIALLMINMEI
  frequency: M
